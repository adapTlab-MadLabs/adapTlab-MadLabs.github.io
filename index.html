<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdapT Lab — Dakota State University</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS
============================================================ */
:root{
  --navy-deep: #0A2F4E;
  --navy-ink: #08192A;
  --blue-primary: #1479C9;
  --blue-bright: #29B6E8;
  --cyan-accent: #6EE7F0;
  --white: #FFFFFF;
  --paper: #F5FAFD;
  --gray-mid: #5C7691;
  --gray-line: #E1EBF3;
  --radius: 14px;
  --ease: cubic-bezier(.16,.84,.44,1);
}

*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:'Inter', sans-serif;
  color: var(--navy-ink);
  background: var(--paper);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4, .display{
  font-family:'Space Grotesk', sans-serif;
  color: var(--navy-deep);
  letter-spacing:-0.01em;
  line-height:1.08;
}
.eyebrow{
  font-family:'JetBrains Mono', monospace;
  font-size:.72rem;
  letter-spacing:.14em;
  text-transform:uppercase;
  color: var(--blue-primary);
  font-weight:500;
}
p{ color:#3A4E60; line-height:1.65; }
a{ color:inherit; text-decoration:none; }
img{ max-width:100%; display:block; }
button{ font-family:inherit; cursor:pointer; }

::selection{ background: var(--cyan-accent); color: var(--navy-ink); }

/* Skip link for keyboard/screen-reader users */
.skip-link{
  position:absolute; left:-999px; top:0; background:var(--navy-deep); color:#fff;
  padding:10px 16px; z-index:999; border-radius:0 0 8px 0;
}
.skip-link:focus{ left:0; }

:focus-visible{ outline:3px solid var(--blue-bright); outline-offset:2px; }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important; }
}

/* ============================================================
   HEX PARTICLE CANVAS (ambient ATMOSPHERE)
============================================================ */
#hexCanvas{
  position:fixed; inset:0; width:100%; height:100%;
  z-index:0; pointer-events:none; opacity:.55;
}

/* ============================================================
   LAYOUT SHELL
============================================================ */
.shell{ display:flex; min-height:100vh; position:relative; z-index:1;}

/* ---- Sidebar (desktop) ---- */
.sidebar{
  width:264px; flex-shrink:0;
  background: linear-gradient(180deg, var(--navy-deep) 0%, var(--navy-ink) 100%);
  color:#fff; position:fixed; top:0; left:0; height:100vh;
  display:flex; flex-direction:column; z-index:50;
  padding:28px 22px;
}
.brand{ display:flex; align-items:center; gap:12px; padding:6px 6px 26px; }
.brand img{ width:42px; height:42px; }
.brand-text{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.05rem; line-height:1.15; color:#fff; }
.brand-text span{ display:block; font-family:'JetBrains Mono',monospace; font-weight:400; font-size:.62rem; letter-spacing:.12em; color:var(--cyan-accent); margin-top:3px; }

.nav-list{ list-style:none; display:flex; flex-direction:column; gap:2px; margin-top:8px; }
.nav-link{
  display:flex; align-items:center; gap:12px;
  padding:11px 12px; border-radius:10px;
  font-size:.9rem; font-weight:500; color:rgba(255,255,255,.68);
  position:relative; transition: color .25s var(--ease), background .25s var(--ease);
}
.nav-hex{
  width:9px; height:9px; flex-shrink:0;
  clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0% 50%);
  background: rgba(255,255,255,.25);
  transition: background .25s var(--ease), transform .25s var(--ease);
}
.nav-link:hover{ color:#fff; background:rgba(255,255,255,.06); }
.nav-link:hover .nav-hex{ background: var(--blue-bright); }
.nav-link.active{ color:#fff; background:rgba(110,231,240,.1); }
.nav-link.active .nav-hex{ background: var(--cyan-accent); transform:scale(1.3); }

.sidebar-footer{ margin-top:auto; padding-top:20px; border-top:1px solid rgba(255,255,255,.1); }
.sidebar-footer p{ color:rgba(255,255,255,.5); font-size:.72rem; line-height:1.6; }
.sidebar-footer strong{ color:rgba(255,255,255,.85); display:block; font-size:.78rem; margin-bottom:2px;}

/* ---- Mobile top bar ---- */
.topbar{ display:none; }

/* ---- Main content ---- */
main{ flex:1; margin-left:264px; min-height:100vh; position:relative; }
.page{ display:none; animation: fadeUp .55s var(--ease); }
.page.active{ display:block; }
@keyframes fadeUp{ from{ opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

.container{ max-width:1080px; margin:0 auto; padding:0 48px; }

/* ============================================================
   REUSABLE PIECES
============================================================ */
.hex-frame{
  clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0% 50%);
  background: linear-gradient(135deg, var(--blue-primary), var(--cyan-accent));
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.hex-frame img{ width:100%; height:100%; object-fit:cover; }

.btn{
  display:inline-flex; align-items:center; gap:8px;
  padding:13px 26px; border-radius:100px; font-weight:600; font-size:.88rem;
  border:none; transition: transform .25s var(--ease), box-shadow .25s var(--ease);
}
.btn-primary{
  background: linear-gradient(120deg, var(--blue-primary), var(--blue-bright));
  color:#fff; box-shadow: 0 8px 20px -6px rgba(20,121,201,.55);
}
.btn-primary:hover{ transform:translateY(-2px); box-shadow: 0 12px 26px -6px rgba(20,121,201,.65); }
.btn-ghost{
  background:#fff; color:var(--navy-deep); border:1.5px solid var(--gray-line);
}
.btn-ghost:hover{ border-color:var(--blue-bright); transform:translateY(-2px); }

.section-head{ max-width:640px; margin-bottom:44px; }
.section-head h2{ font-size:2rem; margin-top:10px; }
.section-head p{ margin-top:12px; font-size:1.02rem; }

/* ============================================================
   HOME — HERO
============================================================ */
.hero{
  padding:80px 48px 40px; position:relative; overflow:hidden;
}
.hero-grid{
  display:grid; grid-template-columns:1.05fr .95fr; gap:56px; align-items:center;
  max-width:1080px; margin:0 auto;
}
.hero h1{ font-size:3.05rem; margin-top:14px; }
.hero h1 em{ font-style:normal; background:linear-gradient(120deg,var(--blue-primary),var(--blue-bright)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.hero p.lead{ font-size:1.08rem; margin-top:18px; max-width:480px; }
.hero-actions{ display:flex; gap:14px; margin-top:32px; flex-wrap:wrap; }

/* Rotating project showcase */
.orbit{
  position:relative; width:100%; aspect-ratio:1/1; max-width:420px; margin:0 auto;
}
.orbit-ring{
  position:absolute; inset:6%; border-radius:50%;
  border:1.5px dashed rgba(20,121,201,.25);
  animation: spin 34s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg);} }
.orbit-center{
  position:absolute; inset:30%; border-radius:50%;
  background:linear-gradient(135deg, var(--navy-deep), var(--blue-primary));
  display:flex; align-items:center; justify-content:center; color:#fff; text-align:center;
  box-shadow:0 20px 50px -18px rgba(10,47,78,.55);
}
.orbit-center span{ font-family:'JetBrains Mono',monospace; font-size:.68rem; letter-spacing:.08em; padding:0 10px;}

.showcase{
  position:relative; width:100%; aspect-ratio:4/3.1; max-width:440px; margin:0 auto;
}
.showcase-card{
  position:absolute; inset:0; border-radius:20px; padding:26px;
  display:flex; flex-direction:column; justify-content:flex-end;
  color:#fff; opacity:0; transform:scale(.94) translateY(10px);
  transition: opacity .7s var(--ease), transform .7s var(--ease);
  background-size:cover; background-position:center;
}
.showcase-card.active{ opacity:1; transform:scale(1) translateY(0); z-index:2; }
.showcase-card .tag{ font-family:'JetBrains Mono',monospace; font-size:.66rem; letter-spacing:.1em; text-transform:uppercase; background:rgba(255,255,255,.18); backdrop-filter:blur(6px); padding:5px 10px; border-radius:100px; width:fit-content; margin-bottom:10px;}
.showcase-card h4{ color:#fff; font-size:1.2rem; }
.showcase-card p{ color:rgba(255,255,255,.82); font-size:.85rem; margin-top:6px;}
.showcase-dots{ display:flex; gap:7px; justify-content:center; margin-top:18px; }
.showcase-dots button{ width:7px; height:7px; border-radius:50%; background:var(--gray-line); border:none; padding:0; transition:.3s; }
.showcase-dots button.active{ background:var(--blue-bright); width:22px; border-radius:5px; }

/* Stat strip */
.stat-strip{
  display:grid; grid-template-columns:repeat(4,1fr); gap:1px;
  background:var(--gray-line); margin:70px 0; border-radius:var(--radius); overflow:hidden;
}
.stat{ background:#fff; padding:26px 22px; }
.stat b{ font-family:'Space Grotesk',sans-serif; font-size:1.7rem; color:var(--navy-deep); display:block; }
.stat span{ font-size:.78rem; color:var(--gray-mid); }

/* Mission band */
.mission-band{
  background: linear-gradient(120deg, var(--navy-deep), #0E3B5F 60%, var(--blue-primary));
  color:#fff; padding:64px 48px; position:relative; overflow:hidden; margin-bottom:0;
}
.mission-band .container{ position:relative; z-index:2; }
.mission-band h2{ color:#fff; font-size:1.9rem; max-width:640px; }
.mission-band p{ color:rgba(255,255,255,.78); max-width:560px; margin-top:14px; }
.mission-band .hexdeco{
  position:absolute; right:-60px; top:-40px; width:340px; height:340px;
  clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0% 50%);
  background: linear-gradient(135deg, rgba(110,231,240,.18), rgba(41,182,232,.05));
  z-index:1;
}

/* Preview cards grid (used on Home to preview Research/News) */
.preview-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:22px; padding:70px 48px; max-width:1080px; margin:0 auto; }
.preview-card{
  background:#fff; border:1px solid var(--gray-line); border-radius:var(--radius);
  padding:26px; transition: transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s var(--ease);
}
.preview-card:hover{ transform:translateY(-5px); box-shadow:0 18px 34px -18px rgba(10,47,78,.25); border-color:transparent; }
.preview-card .hex-frame{ width:44px; height:44px; margin-bottom:16px; }
.preview-card h4{ font-size:1.05rem; }
.preview-card p{ font-size:.88rem; margin-top:8px; }

/* ============================================================
   TEAM PAGE
============================================================ */
.pi-feature{
  display:grid; grid-template-columns:220px 1fr; gap:40px; align-items:center;
  background:#fff; border:1px solid var(--gray-line); border-radius:20px; padding:36px;
  margin-bottom:56px;
}
.pi-feature .hex-frame{ width:220px; height:220px; }
.pi-feature .eyebrow{ margin-bottom:8px; }
.pi-feature h3{ font-size:1.6rem; }
.pi-feature .role{ color:var(--blue-primary); font-weight:600; font-size:.92rem; margin-top:4px; }
.pi-feature p.bio{ margin-top:14px; max-width:600px; }

.team-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:26px; }
.member-card{ text-align:left; }
.member-card .hex-frame{ width:100%; aspect-ratio:1/1; margin-bottom:16px; }
.member-card h4{ font-size:1.02rem; }
.member-card .role{ font-size:.8rem; color:var(--blue-primary); font-weight:600; margin-top:2px;}
.member-card p{ font-size:.85rem; margin-top:8px; }

.join-note{
  margin-top:50px; border:1.5px dashed var(--gray-line); border-radius:16px;
  padding:26px 30px; display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
}

   .partners-section{
  margin-top:50px;
}
.partners-section h2{ font-size:1.4rem; margin-bottom:20px; }
.partners-grid{
  display:grid; grid-template-columns:repeat(4,1fr); gap:24px;
}
.partner-logo{
  background:#fff; border:1px solid var(--gray-line); border-radius:14px;
  padding:24px; display:flex; align-items:center; justify-content:center;
  height:100px; transition: transform .25s var(--ease), box-shadow .25s var(--ease);
}
.partner-logo:hover{ transform:translateY(-3px); box-shadow:0 12px 24px -16px rgba(10,47,78,.3); }
.partner-logo img{ max-width:100%; max-height:60px; object-fit:contain; filter:grayscale(1); opacity:.75; transition:.25s; }
.partner-logo:hover img{ filter:grayscale(0); opacity:1; }

@media (max-width: 720px){
  .sidebar{
    transform:translate3d(-100%,0,0);
    transition:transform .35s var(--ease);
    box-shadow:0 0 40px rgba(0,0,0,.3);
    z-index:100;
  }

  .sidebar.open{
    transform:translate3d(0,0,0);
  }

  main{
    margin-left:0;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 20px;
    background:var(--navy-deep);
    color:#fff;
    position:sticky;
    top:0;
    z-index:110;
  }

  .topbar .brand{
    padding:0;
  }

  .topbar .brand img{
    width:32px;
    height:32px;
  }

  .topbar .brand-text{
    font-size:.92rem;
  }

  .hamburger{
    background:none;
    border:none;
    display:flex;
    flex-direction:column;
    gap:5px;
    padding:10px;
    min-width:44px;
    min-height:44px;
    align-items:center;
    justify-content:center;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }

  .hamburger span{
    width:22px;
    height:2px;
    background:#fff;
    border-radius:2px;
  }

  .scrim{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(8,25,42,.5);
    z-index:90;
  }

  .scrim.show{
    display:block;
  }

  .nav-link{
    min-height:48px;
    padding:12px;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }

  .container{
    padding:0 22px;
  }

  .hero{
    padding:40px 22px;
  }

  .hero h1{
    font-size:2.1rem;
  }

  .mission-band{
    padding:44px 22px;
  }

  .team-grid{
    grid-template-columns:1fr;
  }

  .research-item{
    grid-template-columns:1fr;
  }

  .research-item .hex-frame{
    width:56px;
    height:56px;
  }
}


/* ============================================================
   RESEARCH PAGE
============================================================ */
.research-list{ display:flex; flex-direction:column; gap:20px; }
.research-item{
  display:grid; grid-template-columns:76px 1fr; gap:26px;
  background:#fff; border:1px solid var(--gray-line); border-radius:18px; padding:28px;
  transition:.3s var(--ease); cursor:default;
}
.research-item:hover{ border-color:var(--blue-bright); box-shadow:0 16px 30px -20px rgba(10,47,78,.3); }
.research-item .hex-frame{ width:76px; height:76px; font-family:'Space Grotesk',sans-serif; font-weight:700; color:#fff; font-size:1.4rem;}
.research-item h4{ font-size:1.15rem; }
.research-item .status{ display:inline-block; margin-top:6px; font-family:'JetBrains Mono',monospace; font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:var(--blue-primary); background:#EAF6FC; padding:3px 9px; border-radius:100px; }
.research-item p{ margin-top:10px; font-size:.92rem; }
.research-item .tags{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
.research-item .tags span{ font-size:.72rem; color:var(--gray-mid); background:var(--paper); border:1px solid var(--gray-line); padding:3px 10px; border-radius:100px; }

/* ============================================================
   NEWS PAGE (timeline — legitimate sequence, dated)
============================================================ */
.timeline{ position:relative; padding-left:34px; }
.timeline::before{ content:''; position:absolute; left:6px; top:6px; bottom:6px; width:2px; background:var(--gray-line); }
.news-item{ position:relative; padding-bottom:38px; }
.news-item::before{
  content:''; position:absolute; left:-34px; top:4px; width:14px; height:14px;
  clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0% 50%);
  background: linear-gradient(135deg, var(--blue-primary), var(--cyan-accent));
}
.news-item .date{ font-family:'JetBrains Mono',monospace; font-size:.72rem; color:var(--blue-primary); letter-spacing:.06em;}
.news-item h4{ font-size:1.1rem; margin-top:6px; }
.news-item p{ margin-top:8px; font-size:.92rem; max-width:600px; }

/* ============================================================
   JOIN PAGE
============================================================ */
.opening-card{
  display:flex; justify-content:space-between; align-items:center; gap:20px;
  background:#fff; border:1px solid var(--gray-line); border-radius:16px; padding:24px 28px; margin-bottom:16px;
  flex-wrap:wrap;
}
.opening-card h4{ font-size:1.02rem; }
.opening-card .meta{ font-size:.82rem; color:var(--gray-mid); margin-top:4px; }
.opening-card .status-pill{ font-family:'JetBrains Mono',monospace; font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; padding:4px 11px; border-radius:100px; }
.status-open{ background:#E6F9EE; color:#0F9D58; }
.status-rolling{ background:#EAF6FC; color:var(--blue-primary); }

.process-steps{ display:grid; grid-template-columns:repeat(3,1fr); gap:22px; margin-top:40px; }
.process-step{ padding:22px 0; border-top:2px solid var(--gray-line); }
.process-step .num{ font-family:'JetBrains Mono',monospace; color:var(--blue-bright); font-size:.8rem; }
.process-step h4{ margin-top:8px; font-size:1rem; }
.process-step p{ font-size:.86rem; margin-top:6px; }

/* ============================================================
   CONTACT PAGE
============================================================ */
.contact-grid{ display:grid; grid-template-columns:1fr 1fr; gap:50px; }
.contact-info .info-row{ display:flex; gap:16px; padding:18px 0; border-bottom:1px solid var(--gray-line); }
.contact-info .info-row .hex-frame{ width:38px; height:38px; flex-shrink:0; }
.contact-info .info-row strong{ display:block; font-size:.9rem; color:var(--navy-deep); }
.contact-info .info-row span{ font-size:.86rem; color:var(--gray-mid); }

.form-field{ margin-bottom:18px; }
.form-field label{ display:block; font-size:.82rem; font-weight:600; color:var(--navy-deep); margin-bottom:7px; }
.form-field input, .form-field textarea{
  width:100%; border:1.5px solid var(--gray-line); border-radius:10px; padding:12px 14px;
  font-family:'Inter',sans-serif; font-size:.9rem; transition:.25s;
}
.form-field input:focus, .form-field textarea:focus{ border-color:var(--blue-bright); outline:none; }

footer.page-footer{ padding:40px 48px 60px; text-align:center; }
footer.page-footer p{ font-size:.8rem; color:var(--gray-mid); }

/* ============================================================
   RESPONSIVE
============================================================ */
@media (max-width: 980px){
  .hero-grid{ grid-template-columns:1fr; }
  .preview-grid{ grid-template-columns:1fr; padding:50px 24px; }
  .stat-strip{ grid-template-columns:repeat(2,1fr); margin:40px 24px; }
  .team-grid{ grid-template-columns:repeat(2,1fr); }
  .contact-grid{ grid-template-columns:1fr; }
  .pi-feature{ grid-template-columns:1fr; text-align:center; }
  .pi-feature .hex-frame{ margin:0 auto; }
  .process-steps{ grid-template-columns:1fr; }
}



</style>
</head>
<body>

<a href="#main-content" class="skip-link">Skip to content</a>
<canvas id="hexCanvas" aria-hidden="true"></canvas>
